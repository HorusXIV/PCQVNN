[project]
name = "pcqvnn"
version = "0.1.0"
description = "Quaternion-valued neural networks and predictive coding experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "matplotlib",
    "tqdm",
    "pytest",
    "notebook>=7.5.6",
    "ipykernel>=7.2.0",
    "torchvision>=0.26.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
